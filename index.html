<!doctype html>
<html lang="fr" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="ForgeAgent : la console open source pour créer, tester, intégrer et superviser vos agents IA propulsés par Claude." />
    <meta name="theme-color" content="#0c0a09" />
    <title>ForgeAgent · Console open source pour agents IA</title>
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      try {
        var t = localStorage.getItem('fa:theme') || 'dark'
        var dark = t === 'dark' || (t === 'system' && !matchMedia('(prefers-color-scheme: light)').matches)
        document.documentElement.classList.toggle('dark', dark)
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
