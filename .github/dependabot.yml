version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    groups: { console: { patterns: ['*'] } }
  - package-ecosystem: npm
    directory: /server
    schedule: { interval: weekly }
    groups: { api: { patterns: ['*'] } }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
  - package-ecosystem: docker
    directory: /server
    schedule: { interval: monthly }
